# Deploy RouteLedger on Render (https://render.com) with one click after
# connecting this repository. A free PostgreSQL instance plus a Docker web
# service; the container builds the schema, loads the demo data and creates
# the first admin account on first boot.
databases:
  - name: routeledger-db
    databaseName: routeledger
    user: postgres
    plan: free

services:
  - type: web
    name: routeledger
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: routeledger-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: routeledger-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: routeledger-db
          property: database
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: routeledger-db
          property: connectionString
      - key: DB_USER
        value: routeledger_app
      - key: DB_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@routeledger.example
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: RouteLedger Admin
      - key: COOKIE_SECURE
        value: "true"
      - key: TOKEN_MINUTES
        value: "60"
