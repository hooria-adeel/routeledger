name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routeledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d routeledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: routeledger_test
      DB_USER: routeledger_app
      DB_PASSWORD: ci-app-password
      SECRET_KEY: ci-secret-key-not-used-in-production
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/routeledger_test
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build the test database
        working-directory: backend
        run: python -m scripts.bootstrap_db

      - name: Run the test suite
        working-directory: backend
        run: pytest -q

      - name: Audit dependencies (advisory)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: routeledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
